<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E1112D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>ДефиКарта</title>
    <script>
      /* Phones and installed apps open the app. A desktop browser opens the website (/site/), which shows
         the map and the same app inside a phone frame (an iframe, so the app still sees a phone-sized
         viewport). The outer page must not start a second copy of the app: src/app/_layout.tsx returns
         early when __DEFIKARTA_SHELL__ is set. The embedded copy and ?app=1 always get the app. */
      (function () {
        var ua = navigator.userAgent || '';
        var touchDevice = /Android|iPhone|iPad|iPod|Mobi/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
        var installed = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
        var embedded = window.top !== window.self;
        var optOut = /[?&]app=1\b/.test(location.search);
        if (innerWidth >= 900 && !touchDevice && !installed && !embedded && !optOut) {
          window.__DEFIKARTA_SHELL__ = true;
          document.documentElement.setAttribute('data-shell', '1');
          location.replace('/site/index.html' + location.hash);
        }
      })();
    </script>
    <style>
      /* Native builds embed Manrope via expo-font (app.json); the web build loads the same files. */
      @font-face { font-family: 'Manrope'; font-weight: 400; font-display: swap; src: url('/fonts/Manrope_400Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Manrope'; font-weight: 500; font-display: swap; src: url('/fonts/Manrope_500Medium.ttf') format('truetype'); }
      @font-face { font-family: 'Manrope'; font-weight: 600; font-display: swap; src: url('/fonts/Manrope_600SemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'Manrope'; font-weight: 700; font-display: swap; src: url('/fonts/Manrope_700Bold.ttf') format('truetype'); }
      @font-face { font-family: 'Manrope'; font-weight: 800; font-display: swap; src: url('/fonts/Manrope_800ExtraBold.ttf') format('truetype'); }
    </style>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      html[data-shell] #root { display: none; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    </script>
  </body>
</html>
